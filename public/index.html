
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat IA</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="app">

        <aside class="sidebar">
            <h2>✦ Chat IA</h2>

            <button id="new-chat" class="new-chat">
                + Nuevo chat
            </button>

            <p class="sidebar-label">Tus conversaciones</p>

            <div id="chat-history"></div>

            <div class="sidebar-footer">
                Proyecto de aprendizaje
            </div>
        </aside>

        <main class="chat">

            <header class="chat-header">
                <div class="avatar">✦</div>

                <div>
                    <h1>Asistente IA</h1>
                    <span class="status">Tu asistente personal</span>
                </div>
            </header>

            <section
                id="messages"
                class="messages"
                aria-live="polite"
                aria-label="Conversación"
            >
                <div class="welcome">
                    <div class="welcome-icon">✦</div>

                    <h2>¿En qué puedo ayudarte?</h2>

                    <p>
                        Escribí tu pregunta y comencemos
                        una conversación.
                    </p>
                </div>
            </section>

            <form id="chat-form" class="chat-form">
                <label class="sr-only" for="message-input">
                    Escribí tu mensaje
                </label>

                <input
                    type="text"
                    id="message-input"
                    placeholder="Escribí un mensaje..."
                    autocomplete="off"
                    required
                >

                <button type="submit" id="send-button">
                    Enviar
                </button>
            </form>

            <p class="disclaimer">
                La IA puede cometer errores. Verificá la información.
            </p>

        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
